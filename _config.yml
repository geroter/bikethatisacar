title: "The Bike that is a Car"
description: "Classroom activities built around Aliyah Rotman's story, linked to the Ontario curriculum."
url: "https://bikethatisacar.ca"
baseurl: ""
author: Sari Stillman
contact_email: sari.stillman@gmail.com
feedback_form: "https://docs.google.com/forms/d/e/1FAIpQLScuB4BEr1U01WZak3R-CDerBGltdGSo2e081EDnrrY84OKjIQ/viewform"
podcast_url: "https://www.storypirates.com/season-5-podcast/plumber"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

collections:
  activities:
    output: true
    permalink: /:name

defaults:
  - scope:
      path: ""
      type: activities
    values:
      layout: activity

# Grade levels, in the order they appear on the site
grades:
  - key: P
    name: Primary
  - key: J
    name: Junior
  - key: I
    name: Intermediate

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - preview/
  - preview.py
